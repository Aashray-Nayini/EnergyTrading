### ALICE - Virtual Trader Configuration Setup (VTSE)

# Asset Parameters
SOC_max: 20                                 # MWh - Max Capacity
R_max: 10                                   # MW - Max Power
SOC_i: 0                                    # MWh - Initial state of charge
FCR_max: 0.8                                # %of SOC_max - Maximum allowable FCR bid

# Market
country: "FR"                               # Country string
scheme: "Stochastic"                        # Optimization scheme 
W: 20                                       # Number of scenarios
markets: "FCR-D + DA with imbalance"        # Markets to participate in

# Solution Mode (for Stochastic scheme)
quality: False                              # bool - Ex-post Out-of-Sample Analysis
risk: True                                  # bool - Risk Analysis
alpha_risk: 0.9                             # %/100 - CVaR Confidence Level α
beta_risk: 0.4                              # Risk Aversion β